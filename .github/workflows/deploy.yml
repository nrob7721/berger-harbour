name: Deploy (dev)

# Every push to main: checks → build both images once (tagged with the commit SHA) into the shared registry in the
# prod project → deploy to dev. Production is promoted from these same images by release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    # Dev's deploy identity pushes the images (it has writer on the shared registry and nothing else in prod).
    environment: dev
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no JSON keys
    strategy:
      matrix:
        include:
          - service: public-api
            project: PublicApi
          - service: admin-api
            project: AdminApi
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet
          IMAGE=australia-southeast1-docker.pkg.dev/${{ vars.GCP_REGISTRY_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ matrix.service }}:${GITHUB_SHA}
          docker build -f src/BergerHarbour.${{ matrix.project }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  dev:
    needs: images
    permissions:
      contents: read
      id-token: write # granted to the called workflow's deploy job
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit
