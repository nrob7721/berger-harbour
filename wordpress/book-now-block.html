<!--
  Berger Houseboats "Book Now" button.
  Paste this into a Custom HTML block on each boat's WordPress page.
  The ONLY thing to change per page is data-boat: the boat's slug, as in https://bergerhouseboats.com.au/houseboats/<slug>/
-->
<button type="button" class="bh-book-now" data-boat="pacific-blue">Book Now</button>

<style>
  .bh-book-now {
    display: inline-block;
    padding: 12px 28px;
    border: none;
    border-radius: 6px;
    background: #284863;
    color: #fff;
    font: 600 17px/1.2 inherit;
    cursor: pointer;
  }
  .bh-book-now:hover { background: #1e3a52; }
  .bh-book-now:focus-visible { outline: 3px solid #2f6fb0; outline-offset: 2px; }
  /* A native <dialog> opened with showModal(): it sits in the top layer, so no z-index is needed. */
  .bh-modal {
    width: min(1100px, calc(100vw - 48px));
    height: min(860px, calc(100vh - 48px));
    max-width: none;
    max-height: none;
    padding: 0;
    border: none;
    border-radius: 10px;
    overflow: hidden;
    background: #f5f6f8;
    box-shadow: 0 10px 30px rgba(16, 24, 40, 0.3);
  }
  .bh-modal::backdrop { background: rgba(16, 24, 40, 0.6); }
  .bh-modal__frame { width: 100%; height: 100%; border: 0; display: block; }
  .bh-modal__close { position: absolute; top: 8px; right: 10px; z-index: 1; width: 40px; height: 40px; border: none; border-radius: 50%; background: #fff; color: #1b2230; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); }
  .bh-modal__close:focus-visible { outline: 3px solid #2f6fb0; outline-offset: 2px; }
  /* The page doesn't scroll behind an open booking dialog. */
  html:has(dialog.bh-modal[open]) { overflow: hidden; }
</style>

<script>
  (function () {
    // Initialise once per page, however many Book Now blocks it has.
    if (window.__bhBookNow) return;
    window.__bhBookNow = true;

    var BOOKING_ORIGIN = 'https://bookings.bergerhouseboats.com.au';
    var MOBILE = '(max-width: 768px), (pointer: coarse)';
    var current = null;

    function bookingUrl(slug) {
      return BOOKING_ORIGIN + '/?boat=' + encodeURIComponent(slug);
    }

    function openModal(slug, name, opener) {
      if (current) return; // showModal() makes the page inert, so this only guards against a double click

      // Each click creates a fresh dialog. showModal() traps focus and makes the rest of the page inert.
      var dialog = document.createElement('dialog');
      dialog.className = 'bh-modal';
      dialog.setAttribute('aria-label', 'Book ' + name);

      var closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.className = 'bh-modal__close';
      closeButton.setAttribute('aria-label', 'Close booking');
      closeButton.innerHTML = '&times;';
      closeButton.addEventListener('click', function () { dialog.close(); });

      var frame = document.createElement('iframe');
      frame.className = 'bh-modal__frame';
      frame.src = bookingUrl(slug);
      frame.title = 'Book ' + name;
      frame.setAttribute('allow', 'payment');

      dialog.appendChild(closeButton);
      dialog.appendChild(frame);

      // A click on the backdrop targets the dialog itself (its content fills the dialog box).
      // closedby="any" isn't used because Safari doesn't support it.
      dialog.addEventListener('click', function (e) {
        if (e.target === dialog) dialog.close();
      });

      // However it closes (close button, Esc through the native cancel event, the backdrop, or the booking app's message),
      // focus returns to the Book Now button and the dialog is removed so the iframe stops running.
      dialog.addEventListener('close', function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
        current = null;
        if (opener && opener.focus) opener.focus();
      });

      document.body.appendChild(dialog);
      current = dialog;
      dialog.showModal();
      closeButton.focus();
    }

    // The booking app asks to close the dialog when the customer is done. Only trust the booking site.
    window.addEventListener('message', function (e) {
      if (e.origin !== BOOKING_ORIGIN) return;
      if (e.data && e.data.type === 'bh-booking:close' && current) current.close();
    });

    document.addEventListener('click', function (e) {
      var button = e.target && e.target.closest ? e.target.closest('.bh-book-now') : null;
      if (!button) return;
      e.preventDefault();
      var slug = button.getAttribute('data-boat') || '';
      var name = (document.querySelector('h1') || {}).textContent || 'a houseboat';
      if (window.matchMedia && window.matchMedia(MOBILE).matches) {
        window.open(bookingUrl(slug), '_blank', 'noopener');
      } else {
        openModal(slug, name.trim(), button);
      }
    });
  })();
</script>
